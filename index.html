<script>
  function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBody = document.getElementById('chatBody');
    const text = input.value.trim();

    if (!text) return;

    // إضافة رسالة المستخدم
    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    chatBody.appendChild(userMsg);

    input.value = '';
    chatBody.scrollTop = chatBody.scrollHeight;

    // مؤشر التحميل والتفكير الاستخباري
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'message bot';
    loadingMsg.innerHTML = '⏳ <i>جاري معالجة الاستفسار عبر المحرك التوليدي لعقيدة أصلان سلطان...</i>';
    chatBody.appendChild(loadingMsg);
    chatBody.scrollTop = chatBody.scrollHeight;

    try {
      const response = await fetch('https://aslan-sultan-ai-agent.onrender.com/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: text })
      });

      const data = await response.json();
      chatBody.removeChild(loadingMsg);

      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      // تنسيق الأسطر والفقرات الناتجة من الذكاء الاصطناعي التوليدي
      const formattedText = data.analysis.replace(/\n/g, '<br>');
      botMsg.innerHTML = formattedText;
      
      chatBody.appendChild(botMsg);
      chatBody.scrollTop = chatBody.scrollHeight;

    } catch (err) {
      chatBody.removeChild(loadingMsg);
      const errorMsg = document.createElement('div');
      errorMsg.className = 'message bot';
      errorMsg.textContent = '❌ تعذر الاتصال بالمحرك، يرجى المحاولة بعد لحظات.';
      chatBody.appendChild(errorMsg);
    }
  }
</script>
